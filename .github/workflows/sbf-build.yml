name: Solana SBF build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Load stable Devnet identities
        id: identities
        shell: bash
        env:
          DEVNET_PAYER_KEYPAIR: ${{ secrets.DEVNET_PAYER_KEYPAIR }}
          DEVNET_PROGRAM_KEYPAIR: ${{ secrets.DEVNET_PROGRAM_KEYPAIR }}
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          test -n "$DEVNET_PAYER_KEYPAIR"
          test -n "$DEVNET_PROGRAM_KEYPAIR"
          printf '%s' "$DEVNET_PAYER_KEYPAIR" > devnet-payer.json
          printf '%s' "$DEVNET_PROGRAM_KEYPAIR" > devnet-program.json
          PROGRAM_ID="$(solana-keygen pubkey devnet-program.json)"
          sed -i -E "s/declare_id!\(\"[1-9A-HJ-NP-Za-km-z]+\"\)/declare_id!(\"$PROGRAM_ID\")/" programs/kabo-wheel/src/lib.rs
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"
          echo "Stable Devnet program: $PROGRAM_ID"

      - name: Run host tests
        run: cargo test -p kabo-wheel

      - name: Build deployable SBF program
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo build-sbf --manifest-path programs/kabo-wheel/Cargo.toml

      - name: Upload deployable program
        uses: actions/upload-artifact@v4
        with:
          name: kabo-wheel-sbf
          path: target/deploy/kabo_wheel.so
          if-no-files-found: error

      - name: Deploy smoke test to Devnet
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana config set --url devnet --keypair devnet-payer.json
          for amount in 5 2 2 1; do
            solana airdrop "$amount" && break
            sleep 15
          done
          solana balance
          solana program deploy --program-id devnet-program.json target/deploy/kabo_wheel.so
          solana program show "${{ steps.identities.outputs.program_id }}"
