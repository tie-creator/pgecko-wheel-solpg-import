[package]
name = "kabo-wheel"
version = "0.1.0"
description = "KABO VRF wheel and on-chain SPL token burns"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kabo_wheel"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "orao-solana-vrf/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = "=0.32.1"
orao-solana-vrf = { version = "=0.7.0", default-features = false, features = ["cpi"] }
